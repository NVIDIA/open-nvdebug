<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- __NVDEBUG_MANIFEST_PLACEHOLDER__ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NVDebug Report</title>
    <style>
      body { margin: 0; background: #0a0a0a; }
      .nv-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #0a0a0a;
        background-image: radial-gradient(ellipse at 50% 40%, rgba(118, 185, 0, 0.04) 0%, transparent 60%);
      }
      .nv-splash__logo { opacity: 0; animation: nv-splash-fade 0.5s 0.1s ease forwards; }
      .nv-splash__title {
        color: #76B900;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.015em;
        opacity: 0;
        animation: nv-splash-fade 0.5s 0.2s ease forwards;
      }
      .nv-splash__spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(118, 185, 0, 0.15);
        border-top-color: #76B900;
        border-radius: 50%;
        opacity: 0;
        animation: nv-splash-fade 0.4s 0.35s ease forwards, nv-splash-spin 0.75s 0.35s linear infinite;
      }
      .nv-splash__text {
        color: #8f8f8f;
        font-size: 12px;
        letter-spacing: 0.05em;
        opacity: 0;
        animation: nv-splash-fade 0.4s 0.5s ease forwards;
      }
      @keyframes nv-splash-fade { to { opacity: 1; } }
      @keyframes nv-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="nv-splash">
