# NVLink OOB URI
# --------------------------------------------------------------
# This is a list of NVLink OOB URIs to be collected.
# List URIs to be collected for NVLinks, eg. NVL5. If empty, we collect System Event Logs
# Default URIs below are arbitrary and must be changed to URIs that are relevant to the DUT.
# --------------------------------------------------------------
# * Be sure to uncomment the entire block to use it.
# --------------------------------------------------------------
# NVLINK_OOB_URI:
#   - "/redfish/v1/SomeResource/SubResource"
#   - "/redfish/v1/SomeResource/SubResource2"
#   - "/redfish/v1/SomeResource/SubResource3"

# Additional OOB URI Collection
# --------------------------------------------------------------
# This is a list of additional Redfish URIs to be collected.
# Default URIs below are arbitrary and must be changed to URIs that are relevant to the DUT.
# --------------------------------------------------------------
# * Be sure to uncomment the entire block to use it.
# --------------------------------------------------------------
# ADDITIONAL_OOB_URI_COLLECTION:
#   - "/redfish/v1/SomeResource/SubResource"
#   - "/redfish/v1/SomeResource/SubResource2"
#   - "/redfish/v1/SomeResource/SubResource3"

# Custom Dump Services
# --------------------------------------------------------------
# This is a list of custom dump services to be collected.
