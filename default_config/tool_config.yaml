# Post Code URI Configuration
# --------------------------------------------------------------
# Post Codes configuration
# Custom PostCodes URI patterns (overrides default PostCodes/Entries)
# Can be a string or list of strings
# Supports {system_id} variable substitution
# Examples:
#   - "/redfish/v1/Systems/{system_id}/LogServices/CurrentBIOSPostCodes/Entries"
#   - "/redfish/v1/Systems/{system_id}/LogServices/PreviousBIOSPostCodes/Entries"
# --------------------------------------------------------------
# * Be sure to uncomment the entire block to use it.
# --------------------------------------------------------------
# POST_CODES_URI:
#   - "/redfish/v1/Systems/{system_id}/LogServices/CurrentBIOSPostCodes/Entries"
#   - "/redfish/v1/Systems/{system_id}/LogServices/PreviousBIOSPostCodes/Entries"

# NVIDIA Bug Report Settings (H11)
# --------------------------------------------------------------
# Enables additional log collection for H11 (nvidia-bug-report) when true.
# This runs nvidia-bug-report.sh with --extra-system-data in addition to the
# default safe/standard modes. Use with caution as it can hang some systems.
# Can be overridden per-DUT in dut_config.yaml under DUT_Defaults or individual duts.
# --------------------------------------------------------------
# EXTRA_LOG_COLLECTION: true

