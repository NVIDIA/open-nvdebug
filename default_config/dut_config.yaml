# Currently only supports same type of DUT with the same config file passed through -C option
# Settings that are common among DUTs can be filled in DUT_Defaults.
# DUT specific details like BMC IP, etc, can be overriden for each dut object
DUT_Defaults: &dut_defaults ## User should not modify this line or add anything before this section
  # Type of the DUT. Allowed options are Compute, SwitchTray and PowerShelf
  NodeType: "Compute"
  # Server Baseboard Type
  # The accepted values are as follows can be found by running the command ./nvdebug list-baseboard
  #
  # baseboard: ""

  # BMC IP address
  # This can also be provided via CLI using the -i option
  BMC_IP: ""

  # BMC credentials
  # This can also be provided via CLI using the -u and -p options respectively
  BMC_USERNAME: ""
  BMC_PASSWORD: ""

  # BMC SSH Credentials
  BMC_SSH_USERNAME: ""
  BMC_SSH_PASSWORD: ""
  # BMC_SSH_KEY_PATH: ""
  # BMC_SSH_PASSWORDLESS: false
  # BMC_SSH_PORT: 22

  # HMC Configuration
  # HMC_TCP_PORT: 80 # Default is 80, use 443 for HMC with SSL enabled, if provided, HMC_RF_PROTOCOL will be ignored.
  # HMC_RF_PROTOCOL: "http" # Default is "http", use "https" for HMC with SSL enabled, if provided, HMC_TCP_PORT will be ignored. http defaults to port 80, https defaults to port 443

  # Redfish credentials
  # If not provided, it is assumed to be the same as the BMC credentials
  RF_User: ""
  RF_Pass: ""

  # Redfish TLS server authentication is disabled by default for compatibility
  # with lab/manufacturing BMCs using self-signed certificates. On a trusted
  # management network, credentials alone are sufficient. To opt into the
  # operating-system CA trust store, select:
  # bmc_rf_tls_mode: "system_ca"
  #
  # For an internal CA, install or obtain its CA bundle through your approved
  # provisioning channel and configure:
  # bmc_rf_tls_mode: "custom_ca"
  # bmc_rf_ca_file: "/path/to/approved-bmc-ca.pem"
  #
  # For a self-signed certificate, independently verify the certificate's
  # SHA-256 fingerprint through the BMC management UI, provisioning records,
  # or the system owner before configuring:
  # bmc_rf_tls_mode: "fingerprint"
  # bmc_rf_fingerprint_sha256: "<verified 64-hex SHA-256 certificate fingerprint>"
  #
  # When connecting through a tunnel or IP address, set the certificate name:
  # bmc_rf_tls_server_name: "bmc.example.internal"
  #
  # "insecure" is the accepted compatibility default and can be stated explicitly:
  # bmc_rf_tls_mode: "insecure"
  #
  # Legacy migration:
  #   bmc_rf_verify_ssl: true  -> bmc_rf_tls_mode: "system_ca"
  #   bmc_rf_verify_ssl: false -> bmc_rf_tls_mode: "insecure"

  # Port to be used for port forwarding
  # To collect certain logs from HMC, port forwarding needs to be setup. NVDebug will setup port forwarding using the provided port
  # If no port is provided below, the default port 18888 will be used
  TUNNEL_TCP_PORT: ""
  ipmi_cipher: "-C17"

  # Host details for Host log collection
  # If IP or credentials are not provided, NVDebug assumes it is running on the host
  HOST_IP: ""
  HOST_USERNAME: ""
  HOST_PASSWORD: ""
  # HOST_SSH_KEY_PATH: ""
  # HOST_SSH_PASSWORDLESS: false # SSH authentication only; sudo is configured separately below.
  # HOST_SSH_PORT: 22
  # With a key path, HOST_PASSWORD unlocks the local private key only.
  # Optional remote sudo password; omit if sudo needs no password prompt.
  # Password-based SSH otherwise continues to reuse HOST_PASSWORD for sudo.
  # host_sudo_password: ""

  # NVIDIA Bug Report Settings (H11)
  # Enables additional log collection when set to true. This runs
  # nvidia-bug-report.sh with --extra-system-data. Use only for deep
  # diagnostics; may increase runtime or impact system stability.
  EXTRA_LOG_COLLECTION: false

  # Redfish info
  RF_DEFAULT_PREFIX: "/redfish/v1" # Redfish service root. Default is "/redfish/v1"
  # RF_HMC_DEFAULT_PREFIX: "/redfish/v1" # HMC-specific Redfish prefix (arm64 / aggregation platforms only).
  #   When set, URIs targeting HGX_* resources (e.g. HGX_Baseboard_0, HGX_BMC_0) will use this
  #   prefix instead of RF_DEFAULT_PREFIX. Useful when the Customer BMC exposes HMC resources
  #   under a different Redfish root path. Takes precedence over uri_overrides.hmc_prefix_override.
  RF_AUTH: true # Indicates if REST API authentication is required by the Redfish service. True by default
  # RF_HMC_ACCESS_METHOD: HostBmcTcpPortForwarding # Available options: HostBmcTcpPortForwarding, HostBmcTcp, HmcTcpPortForwarding, HmcTcp

  # Port forwarding configuration
  # If set to true, the tool will use port forwarding to collect logs from HMC
  # USE_PORT_FORWARDING: False
  # When set to False, the tool expects port forwarding to be setup manually if a port is provided
  # Set it to true to make the tool handle port forwarding setup
  # SETUP_PORT_FORWARDING: False
  # If set to true, the tool will clear any process on the ports defined via TUNNEL_TCP_PORT before setting up port forwarding
  # FORCE_PORT_FW: False
  # Port to be used for port forwarding
  # If no port is provided below, the default port 18888 will be used
  # TUNNEL_TCP_PORT: 18888

  # SSH tunnel configuration (for port forwarding)
  # Host-key verification is disabled by default for password-only compatibility
  # on trusted management networks. To opt into OpenSSH known-hosts trust:
  # ssh_host_key_policy: "strict"
  # ssh_known_hosts_file: "/etc/nvdebug/known_hosts"
  # To state the accepted compatibility default explicitly:
  # ssh_host_key_policy: "insecure"
  # Legacy StrictHostKeyChecking=no/false/off values in SSH_TUNNEL_OPTIONS are
  # migrated to that same DUT-wide insecure policy. It applies to BMC, HMC,
  # Host, proxy/jump-host, SFTP, and OpenSSH tunnel routes for the DUT.
  # Local host to bind the tunnel to (default: localhost)
  # TUNNEL_LOCAL_HOST: "localhost"
  # At execution, nvdebug appends host-key controls from ssh_host_key_policy.
  # SSH_TUNNEL_OPTIONS: "-4 -o LogLevel=ERROR -fNT"
  # Passwords are read from descriptor 0 instead of being exposed in argv.
  # The older "sshpass -p" spelling is accepted only as a migration alias and
  # is normalized to this descriptor-safe value.
  # SSH_TUNNEL_PREFIX: "sshpass -d 0"

  # Specify whether the BMC/Host network is "ipv4" or "ipv6". Default is "ipv4"
  IP_NETWORK: 'ipv4'

# Create a dut object and inherit defaults.
# For any specific config details, add them below <<: *dut_defaults
# dut-1:
#   <<: *dut_defaults
#   baseboard: ""
#   ConfigFileToUse: "<path to config file>"
#   NodeType: "Compute"
#   HOST_IP: ""
#   HOST_USERNAME: ""
#   HOST_PASSWORD: ""
#   BMC_IP: ""
#   BMC_USERNAME: ""
#   BMC_PASSWORD: ""
